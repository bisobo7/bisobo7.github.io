# .github/workflows/deploy.yml
# Builds the Astro site at the repo root and deploys it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The bot lives in this repo but is not part of the site. Editing it
    # should not burn an Actions run rebuilding pages that did not change.
    # Vehicle markdown is NOT ignored here — that is what the bot commits.
    paths-ignore:
      - 'bot/**'
      - 'legacy-v1/**'
      - 'README.md'
      - 'SPEC.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # IndexNow tells Bing/Yandex/Seznam/Naver what just changed (Google ignores
  # it). Runs only after the deploy succeeds, so every URL it names is live.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit changed URLs
        # A failed ping must never show up as a failed deploy: the site is already
        # live, and the next push will submit these URLs again anyway.
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || ! git rev-parse --quiet --verify "${{ github.event.before }}^{commit}" > /dev/null; then
            # Manual run, or a first push with no previous commit to diff against.
            node scripts/indexnow.mjs --all
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
              | xargs -r node scripts/indexnow.mjs
          fi
